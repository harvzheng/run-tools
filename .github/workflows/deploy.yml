name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Deploy step — uncomment when Vercel or hosting is configured
      # - run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
